name: VFS Bulgaria Cloud Watcher

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Telegram test mesajı gönder'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vfs-bulgaria-watcher
  cancel-in-progress: false

jobs:
  check-vfs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore outage state cache
        uses: actions/cache@v4
        with:
          path: .cache/outage.json
          key: outage-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            outage-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Test Telegram delivery
        if: ${{ inputs.test_telegram }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, sys, requests
          token = os.getenv('TG_BOT_TOKEN', '').strip()
          chat_id = os.getenv('TG_CHAT_ID', '').strip()
          if not token or not chat_id:
              print('Telegram test failed: TG_BOT_TOKEN or TG_CHAT_ID secret is empty.')
              sys.exit(1)
          try:
              response = requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id': chat_id, 'text': '✅ VFS Bulgaria Watcher: Telegram test mesajı başarılı.'},
                  timeout=15,
              )
              try:
                  data = response.json()
              except ValueError:
                  data = {}
              if response.ok and data.get('ok'):
                  print('Telegram test message delivered successfully.')
              else:
                  print(f"Telegram test failed: HTTP {response.status_code}; {data.get('description', 'No API description')}")
                  sys.exit(1)
          except requests.RequestException as exc:
              print(f'Telegram test request failed: {type(exc).__name__}: {exc}')
              sys.exit(1)
          PY

      - name: Run watcher
        id: run_watcher
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then echo "::warning::TG_BOT_TOKEN secret is missing"; fi
          if [ -z "$TG_CHAT_ID" ]; then echo "::warning::TG_CHAT_ID secret is missing"; fi
          python checker.py

      # Merge the generated state with the latest main branch before pushing.
      # This preserves seen hashes from both sides and retries concurrent updates.
      - name: Merge and push state safely
        if: always() && steps.run_watcher.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f state.json ]; then
            echo "state.json missing; nothing to merge."
            exit 0
          fi

          cp state.json /tmp/state-generated.json
          git config user.name "vfs-watcher"
          git config user.email "vfs-watcher@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "State sync attempt $attempt/5"
            git fetch origin main
            git checkout -B main origin/main

            python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          generated = json.loads(Path("/tmp/state-generated.json").read_text(encoding="utf-8"))
          current_path = Path("state.json")
          if current_path.exists():
              current = json.loads(current_path.read_text(encoding="utf-8"))
          else:
              current = {}

          seen = list(dict.fromkeys((current.get("seen") or []) + (generated.get("seen") or [])))
          merged = dict(current)
          merged.update({k: v for k, v in generated.items() if k not in ("seen",)})
          merged["seen"] = seen[-1000:]
          merged["initialized"] = bool(current.get("initialized") or generated.get("initialized"))
          merged["v3_1_baseline"] = bool(current.get("v3_1_baseline") or generated.get("v3_1_baseline"))
          merged["version"] = generated.get("version", current.get("version", "3.2"))
          current_path.write_text(json.dumps(merged, ensure_ascii=False, indent=2, sort_keys=True) + chr(10), encoding="utf-8")
          print(f"Merged seen hashes: {len(merged['seen'])}")
          PY

            git add state.json
            if git diff --cached --quiet; then
              echo "State already up to date."
              exit 0
            fi
            git commit -m "Update VFS watcher state"
            if git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi
            echo "Push rejected; retrying against latest main."
          done

          echo "::error::Could not sync state after 5 attempts."
          exit 1
