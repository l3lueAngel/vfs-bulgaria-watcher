name: VFS Bulgaria Cloud Watcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vfs-bulgaria-watcher
  cancel-in-progress: false

jobs:
  check-vfs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore outage state cache
        uses: actions/cache@v4
        with:
          path: .cache/outage.json
          key: outage-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            outage-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run watcher
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checker.py

      - name: Commit state only if changed
        run: |
          git config user.name "vfs-watcher"
          git config user.email "vfs-watcher@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update VFS watcher state"
            git push
          else
            echo "No state changes; no commit."
          fi