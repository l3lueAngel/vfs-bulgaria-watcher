name: VFS Bulgaria Cloud Watcher

on:
  schedule:
    # Her 45 dakikada bir yeni nöbetçi başlar
    - cron: '*/45 * * * *'
  workflow_dispatch:

jobs:
  check-vfs:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Kodu Al
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Paketleri Kur
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: 12 Sehri Tara
        run: |
          python checker.py
