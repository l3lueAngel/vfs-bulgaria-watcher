name: VFS Bulgaria Watcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vfs-bulgaria-watcher
  cancel-in-progress: false

jobs:
  check-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python test_v3_1_logic.py

      - name: Restore outage cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: outage-state-${{ github.run_id }}
          restore-keys: |
            outage-state-

      - name: Run watcher
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checker.py

      - name: Ensure cache dir exists
        if: always()
        run: mkdir -p .cache

      - name: Save outage cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: outage-state-${{ github.run_id }}

      - name: Commit and push state if changed
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "state.json bulunamadi."
            exit 0
          fi

          if git diff --quiet -- state.json; then
            echo "State degismedi. Commit yok."
            exit 0
          fi

          echo "State degisti. Commit hazirlaniyor..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp state.json /tmp/state.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/state.json state.json

          if git diff --quiet -- state.json; then
            echo "State zaten guncel. Commit yok."
            exit 0
          fi

          git add state.json
          git commit -m "Update VFS watcher state"
          git push origin HEAD:main
